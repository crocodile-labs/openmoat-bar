name: desktop

# MoatBar for Linux and Windows (desktop/): build and test on both.
on:
  pull_request:
    paths:
      - "desktop/**"
      - "Tests/MoatBarCoreTests/Fixtures/**"
      - "Sources/MoatBar/Resources/**"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "Tests/MoatBarCoreTests/Fixtures/**"
      - "Sources/MoatBar/Resources/**"
      - ".github/workflows/desktop.yml"

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
          - name: windows
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write # the ci-shots/* branches only
    steps:
      - uses: actions/checkout@v5

      - name: Linux packages Qt needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 libegl1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          cache: true

      - name: Configure
        run: cmake -S desktop -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --build-config Release --output-on-failure

      # The menu and tray icons drawn offscreen from the fixtures, kept with the
      # run so they can be looked at without a Linux or Windows machine.
      - name: Screenshots
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # Qt's offscreen platform on Windows has no font list of its own.
          if [ "$RUNNER_OS" = "Windows" ]; then export QT_QPA_FONTDIR="C:/Windows/Fonts"; fi
          shots=$(find build -type f \( -name moatbar_shots -o -name moatbar_shots.exe \) | head -n 1)
          test -n "$shots"
          "$shots" screenshots

      - name: Keep the screenshots
        uses: actions/upload-artifact@v4
        with:
          name: moatbar-${{ matrix.name }}-screenshots
          path: screenshots/*.png
          if-no-files-found: error

      # Also on a branch of their own (ci-shots/linux, ci-shots/windows), so they
      # can be read through the contents API by reviewers who can't download
      # artifacts. Only for this repository's own branches.
      - name: Publish the screenshots to ci-shots/${{ matrix.name }}
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd screenshots
          git init -q
          git config user.name "moatbar-ci"
          git config user.email "moatbar-ci@users.noreply.github.com"
          git add -- *.png
          git commit -q -m "Screenshots for ${{ github.event.pull_request.head.ref }} at ${{ github.event.pull_request.head.sha }}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-shots/${{ matrix.name }}

  # The README's Linux commands as written: Ubuntu's own Qt (6.4), no extra installer.
  ubuntu-packages:
    name: linux (Ubuntu Qt packages)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install what the README lists
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake qt6-base-dev qt6-declarative-dev \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates qml6-module-qtquick-window qml6-module-qtqml-workerscript

      # The Quick View's QML must load on Qt 6.4 too: the screenshot tool fails on any QML warning.
      - name: Build, test and draw the Quick View
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake -S desktop -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          test -x build/src/app/moatbar
          build/tools/moatbar_shots screenshots
