name: ci

on:
  # The macOS app. Changes only under desktop/ run the desktop workflow instead,
  # so they don't spend macOS minutes.
  pull_request:
    paths-ignore:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths-ignore:
      - "desktop/**"
      - ".github/workflows/desktop.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: build · test · lint
    # One macOS job: SwiftPM build, tests and lint in one pass.
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Tools
        run: |
          swift --version
          brew install swiftformat swiftlint >/dev/null || brew upgrade swiftformat swiftlint >/dev/null || true
          swiftformat --version
          swiftlint version

      # Plain reporters so the log names file and line for every finding.
      - name: Format
        run: swiftformat --lint .

      - name: Lint
        run: swiftlint --strict

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      # The fallback for machines where SwiftPM can't read Package.swift.
      - name: Package without SwiftPM
        run: MOATBAR_DIRECT_BUILD=1 ./Scripts/package_app.sh

      # The README screenshots are rendered from the app's views; keep that working.
      - name: Render screenshots
        run: ./Scripts/snapshots.sh
